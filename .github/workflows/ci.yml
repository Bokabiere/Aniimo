name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Cohérence des données avec les références
        run: npm run data:check

      - name: Build
        run: npm run build
